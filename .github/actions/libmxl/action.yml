name: Provide libmxl
description: >-
  Puts libmxl, libmxl-monitoring, opentelemetry-cpp and pkg-config on the
  runner, and the flags that link them in CGO_LDFLAGS, so the packages that
  bind libmxl through cgo can be compiled, vetted and tested.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # The version comes from the image recipe rather than being repeated
        # here. Every reader and writer sharing an MXL domain has to link a
        # byte-identical libmxl, so what CI links and what the released image
        # links cannot be allowed to drift apart.
        tag=$(sed -n 's/^ARG GO_MXL_TAG=//p' Dockerfile.mxl | head -1)
        if [ -z "$tag" ]; then
          echo "no ARG GO_MXL_TAG in Dockerfile.mxl" >&2
          exit 1
        fi

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config

        # The builder image carries libmxl under /opt/libmxl. Landing it at
        # the same prefix keeps the paths its pkg-config file records valid.
        cid=$(docker create "ghcr.io/qvest-digital/go-mxl-builder:${tag}")
        docker cp "$cid:/opt/libmxl" /tmp/libmxl
        docker rm "$cid" >/dev/null
        sudo mv /tmp/libmxl /opt/libmxl

        pkg-config --exists libmxl && echo "libmxl $(pkg-config --modversion libmxl)"
      env:
        PKG_CONFIG_PATH: /opt/libmxl/lib/pkgconfig

    - uses: docker/setup-buildx-action@v3

    # The same stage the image's builder links from, built from the
    # libmxl-monitoring release go.mod requires. opentelemetry-cpp takes
    # minutes to build, so its layer comes from the image's build cache.
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.mxl
        target: monitoring-libs
        outputs: type=local,dest=/tmp/monitoring-libs
        cache-from: |
          type=registry,ref=ghcr.io/qvest-digital/dmf-mf-mediamtx:buildcache
          type=gha,scope=monitoring-libs
        cache-to: type=gha,scope=monitoring-libs,mode=max

    - shell: bash
      run: |
        set -euo pipefail
        sudo cp -r /tmp/monitoring-libs/opt/. /opt/
        echo "CGO_LDFLAGS=$(scripts/mxl-ldflags.sh)" >> "$GITHUB_ENV"
