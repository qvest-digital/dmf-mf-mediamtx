name: lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go:
    runs-on: ubuntu-22.04

    env:
      PKG_CONFIG_PATH: /opt/libmxl/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/libmxl/lib

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - run: go generate ./...

    # The MXL static source binds libmxl through cgo, so without it the
    # package does not typecheck and every linter reports on it.
    - uses: ./.github/actions/libmxl

    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.4

  go_mod:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - run: make lint-go-mod

  conf:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - run: make lint-conf

  go2api:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - run: make lint-go2api

  docslinks:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - run: make lint-docslinks

  docsorder:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - run: make lint-docsorder

  docs:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - run: make lint-docs

  api_docs:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - run: make lint-api-docs
