name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test_64:
    runs-on: ubuntu-24.04

    env:
      PKG_CONFIG_PATH: /opt/libmxl/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/libmxl/lib

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: ./.github/actions/libmxl

      # Runs on the host rather than through the dockerised target: the test
      # image is musl-based and libmxl is built against glibc, so the MXL
      # source cannot link inside it.
      - run: make test-nodocker

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test_32:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # libmxl is published for 64-bit glibc only, so the packages that link
      # it are out of reach here. This covers the rest of the tree on 32-bit.
      - run: make test-32

  test_e2e:
    runs-on: ubuntu-24.04

    env:
      PKG_CONFIG_PATH: /opt/libmxl/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/libmxl/lib

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: ./.github/actions/libmxl

      - run: make test-e2e-nodocker

  # The MXL source encodes through an ffmpeg sidecar, and the tests that start
  # it skip where there is none. They run here against the ffmpeg the released
  # image ships with: Debian's, in the image libmxl comes from, whose tag is
  # read from Dockerfile.mxl so the two cannot drift apart.
  test_mxl_ffmpeg:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - run: |
          set -euo pipefail
          tag=$(sed -n 's/^ARG GO_MXL_TAG=//p' Dockerfile.mxl | head -1)
          docker run --rm -v "$PWD:/src" -w /src \
            -e PKG_CONFIG_PATH=/opt/libmxl/lib/pkgconfig \
            -e LD_LIBRARY_PATH=/opt/libmxl/lib \
            -e GOFLAGS=-buildvcs=false \
            --entrypoint sh "ghcr.io/qvest-digital/go-mxl-builder:${tag}" -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
              command -v ffmpeg >/dev/null
              ffmpeg -version | head -1
              go test -count=1 -v -run "TestBuildOpusArgs|TestOpusEncoder" ./internal/staticsources/mxl/'
