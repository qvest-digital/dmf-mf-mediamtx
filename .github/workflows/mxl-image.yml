name: Build image

# Builds the fork and publishes it to the package this repository owns.
# The mediamtx-mxl packages are frozen: they keep serving the tags already
# published and receive no new builds.

on:
  push:
    branches:
      - main
    tags:
      - "mxl-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # A repository rename leaves this string behind, and a mismatch skips the
    # job silently rather than failing it.
    if: github.repository == 'qvest-digital/dmf-mf-mediamtx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Derive image tags
        id: tags
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/mxl-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mxl-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          platforms: linux/amd64
          # PRs validate the cgo link against libmxl without publishing;
          # branch and tag pushes publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/qvest-digital/dmf-mf-mediamtx:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version && format('ghcr.io/qvest-digital/dmf-mf-mediamtx:{0}', steps.tags.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/qvest-digital/dmf-mf-mediamtx:latest' || '' }}
          cache-from: type=registry,ref=ghcr.io/qvest-digital/dmf-mf-mediamtx:buildcache
          cache-to: type=registry,ref=ghcr.io/qvest-digital/dmf-mf-mediamtx:buildcache,mode=max
