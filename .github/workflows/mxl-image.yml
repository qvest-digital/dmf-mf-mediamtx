name: Build mediamtx-mxl Image

# Builds the qvest-digital mediamtx fork (mxl:// static source + self-heal) and
# pushes to BOTH the canonical package and the mxl-dmf-demo-app package the
# showcase deployment references, so a push here actually updates the demo.

on:
  push:
    branches:
      - feature/mxl-static-source
    tags:
      - "mxl-v*"
  pull_request:
    branches:
      - feature/mxl-static-source
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'qvest-digital/mediamtx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Derive image tags
        id: tags
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/mxl-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mxl-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push mediamtx-mxl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          platforms: linux/amd64
          # PRs validate the build (compile against go-mxl rc.9) without publishing;
          # branch/tag pushes publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/qvest-digital/mediamtx-mxl:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version && format('ghcr.io/qvest-digital/mediamtx-mxl:{0}', steps.tags.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/feature/mxl-static-source' && 'ghcr.io/qvest-digital/mediamtx-mxl:latest' || '' }}
          cache-from: type=registry,ref=ghcr.io/qvest-digital/mediamtx-mxl:buildcache
          cache-to: type=registry,ref=ghcr.io/qvest-digital/mediamtx-mxl:buildcache,mode=max
