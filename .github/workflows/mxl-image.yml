name: Build mediamtx-mxl Image

# Builds the qvest-digital fork variant that includes the new mxl:// static
# source (PR #1) and pushes it to ghcr.io/qvest-digital/mediamtx-mxl so
# downstream consumers (mxl-dmf-demo-app showcase) can pull instead of
# rebuilding mediamtx from source on every push.
#
# Gated on the fork via `if: github.repository == 'qvest-digital/mediamtx'`
# so that if PR #1 is ever opened against upstream bluenviron/mediamtx this
# workflow stays inert there.

on:
  push:
    branches:
      - feature/mxl-static-source
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'qvest-digital/mediamtx'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mediamtx-mxl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qvest-digital/mediamtx-mxl:${{ github.sha }}
            ghcr.io/qvest-digital/mediamtx-mxl:latest
          build-args: |
            LIBMXL_TAG=latest
          cache-from: type=registry,ref=ghcr.io/qvest-digital/mediamtx-mxl:buildcache
          cache-to: type=registry,ref=ghcr.io/qvest-digital/mediamtx-mxl:buildcache,mode=max
